<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="context-path" content="/fd-simulator">
    <title>Register - Fixed Deposit Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 2rem 0;
            position: relative;
            overflow: hidden;
        }
        
        /* Large Circle */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 9s ease-in-out infinite;
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.4);
        }
        
        /* Medium Circle */
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(147, 51, 234, 0.25));
            border-radius: 50%;
            bottom: -175px;
            left: -175px;
            animation: float 11s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.3);
        }
        
        /* Diamond Shape */
        .geometric-diamond {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.2));
            top: 15%;
            left: 8%;
            transform: rotate(45deg);
            animation: rotate 18s linear infinite;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }
        
        /* Pentagon */
        .geometric-pentagon {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(124, 58, 237, 0.18);
            bottom: 20%;
            right: 10%;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            animation: float 13s ease-in-out infinite;
            filter: blur(1px);
        }
        
        /* Small Circles */
        .geometric-circle-1 {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.35), rgba(196, 181, 253, 0.15));
            border-radius: 50%;
            top: 50%;
            right: 5%;
            animation: float 10s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(147, 197, 253, 0.4);
        }
        
        .geometric-circle-2 {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3), rgba(99, 102, 241, 0.15));
            border-radius: 50%;
            top: 70%;
            left: 15%;
            animation: float 15s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }
        
        /* Octagon */
        .geometric-octagon {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(99, 102, 241, 0.15);
            top: 8%;
            right: 30%;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            animation: rotate 22s linear infinite reverse;
            filter: blur(1.5px);
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }
        
        .register-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .register-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }
        
        .register-header h2 {
            position: relative;
            z-index: 1;
        }
        
        .register-form {
            padding: 2.5rem;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            background: #f7fafc;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
            transform: translateY(-2px);
        }
        
        .form-select {
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            background: #f7fafc;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .password-strength {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            transition: all 0.4s ease;
            border-radius: 3px;
        }
        
        .strength-weak { 
            background: linear-gradient(90deg, #dc3545, #c82333);
            width: 25%;
        }
        
        .strength-medium { 
            background: linear-gradient(90deg, #ffc107, #e0a800);
            width: 50%;
        }
        
        .strength-strong { 
            background: linear-gradient(90deg, #28a745, #218838);
            width: 75%;
        }
        
        .strength-very-strong { 
            background: linear-gradient(90deg, #20c997, #17a2b8);
            width: 100%;
        }
        
        .text-decoration-none {
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .text-decoration-none:hover {
            color: #764ba2;
            text-decoration: underline !important;
        }
        
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        
        .form-text {
            color: #718096;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <!-- Geometric Shapes -->
    <div class="geometric-diamond"></div>
    <div class="geometric-pentagon"></div>
    <div class="geometric-circle-1"></div>
    <div class="geometric-circle-2"></div>
    <div class="geometric-octagon"></div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="register-container">
                    <div class="register-header">
                        <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                        <p class="mb-0">Join our Fixed Deposit Simulator</p>
                    </div>
                    <div class="register-form">
                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Username *</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                    <div class="form-text">3-20 characters</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="+1234567890">
                                <div class="form-text">Optional - for OTP login</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="password-strength">
                                    <div class="password-strength-bar" id="strengthBar"></div>
                                </div>
                                <div class="form-text">Minimum 6 characters</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="preferredCurrency" class="form-label">Preferred Currency</label>
                                    <select class="form-select" id="preferredCurrency" name="preferredCurrency">
                                        <option value="USD">USD - US Dollar</option>
                                        <option value="INR">INR - Indian Rupee</option>
                                        <option value="KWD">KWD - Kuwaiti Dinar</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="preferredLanguage" class="form-label">Preferred Language</label>
                                    <select class="form-select" id="preferredLanguage" required>
                                        <option value="en">English</option>
                                        <option value="ja">日本語 (Japanese)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label" for="agreeTerms">
                                    I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-register w-100">
                                <i class="fas fa-user-plus"></i> Create Account
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Already have an account? <a href="/fd-simulator/login" class="text-decoration-none">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/fd-simulator/js/auth.js"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 1) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 2) {
                strengthBar.classList.add('strength-medium');
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-strong');
            } else {
                strengthBar.classList.add('strength-very-strong');
            }
        });

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (username.length < 3 || username.length > 20) {
                alert('Username must be between 3 and 20 characters');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (phoneNumber && !phoneNumber.match(/^\+?[1-9]\d{1,14}$/)) {
                alert('Invalid phone number format');
                return;
            }
            
            // Submit registration
            const formData = {
                username: username,
                email: email,
                phoneNumber: phoneNumber || null,
                password: password,
                preferredCurrency: document.getElementById('preferredCurrency').value,
                preferredLanguage: document.getElementById('preferredLanguage').value
            };
            
            postJson('/api/auth/register', formData, { skipAuth: true })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || `HTTP error! status: ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.message && data.message.includes('successfully')) {
                    alert('✅ Registration successful! Please login.');
                    const base = window.__FD_CONTEXT__ || '/fd-simulator';
                    window.location.href = base + '/login';
                } else {
                    alert('❌ Error: ' + (data.message || JSON.stringify(data)));
                }
            })
            .catch(error => {
                console.error('Registration error:', error);
                alert('❌ Registration failed: ' + error.message);
            });
        });
    </script>
</body>
</html>
