<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="context-path" content="/fd-simulator">
    <title>FD Calculator - CASHCACHED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .calculator-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .calculator-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .calculator-header h1 {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .calculator-header p {
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 10px;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 1rem;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .btn-back:hover {
            background: #5a6268;
        }
        
        .results-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .result-item {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        
        .result-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .result-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <button class="btn btn-back" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> Back to Home
        </button>
        
        <div class="calculator-header">
            <h1><i class="fas fa-calculator"></i> FD Calculator</h1>
            <p>Calculate your Fixed Deposit returns</p>
        </div>
        
        <div id="errorMessage" class="error" style="display: none;"></div>
        
        <div class="form-section">
            <div class="mb-3">
                <label class="form-label">Select FD Product</label>
                <select id="productSelect" class="form-select">
                    <option value="">Loading products...</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Principal Amount (₹)</label>
                <input type="number" id="principalAmount" class="form-control" value="100000" min="5000" step="1000">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Tenure (Months)</label>
                <input type="number" id="tenure" class="form-control" value="12" min="3" max="60">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Interest Rate (%)</label>
                <input type="number" id="interestRate" class="form-control" value="7.5" min="1" max="15" step="0.1" readonly>
            </div>
            
            <button class="btn btn-calculate" onclick="calculateReturns()">
                <i class="fas fa-calculator"></i> Calculate Returns
            </button>
        </div>
        
        <div id="resultsSection" class="results-section">
            <h3 class="mb-4"><i class="fas fa-chart-line"></i> Your Returns</h3>
            
            <div class="result-item">
                <div class="result-label">Principal Amount</div>
                <div class="result-value" id="resultPrincipal">₹0</div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Interest Earned</div>
                <div class="result-value" id="resultInterest">₹0</div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Maturity Amount</div>
                <div class="result-value" id="resultMaturity">₹0</div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Maturity Date</div>
                <div class="result-value" id="resultDate">-</div>
            </div>
        </div>
    </div>
    
    <script src="/fd-simulator/js/auth.js"></script>
    <script>
        const BASE_URL = window.__FD_CONTEXT__ || '/fd-simulator';
        let products = [];
        
        // Load products on page load
        async function loadProducts() {
            try {
                const response = await fetch(BASE_URL + '/api/public/products/active');
                if (!response.ok) throw new Error('Failed to load products');
                
                products = await response.json();
                const select = document.getElementById('productSelect');
                select.innerHTML = '<option value="">-- Select a product --</option>';
                
                products.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.name} (${product.interestRate}% - ${product.minTenure}-${product.maxTenure} months)`;
                    option.dataset.rate = product.interestRate;
                    option.dataset.minTenure = product.minTenure;
                    option.dataset.maxTenure = product.maxTenure;
                    select.appendChild(option);
                });
                
                console.log('✅ Loaded', products.length, 'products');
            } catch (error) {
                console.error('Error loading products:', error);
                showError('Failed to load products. Please refresh the page.');
            }
        }
        
        // Update interest rate when product is selected
        document.getElementById('productSelect').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            if (selectedOption.value) {
                document.getElementById('interestRate').value = selectedOption.dataset.rate;
                document.getElementById('tenure').min = selectedOption.dataset.minTenure;
                document.getElementById('tenure').max = selectedOption.dataset.maxTenure;
            }
        });
        
        // Calculate returns
        function calculateReturns() {
            const principal = parseFloat(document.getElementById('principalAmount').value);
            const tenure = parseInt(document.getElementById('tenure').value);
            const rate = parseFloat(document.getElementById('interestRate').value);
            
            if (!principal || !tenure || !rate) {
                showError('Please fill all fields and select a product');
                return;
            }
            
            // Simple interest calculation
            const interest = (principal * rate * tenure) / (12 * 100);
            const maturity = principal + interest;
            
            // Calculate maturity date
            const maturityDate = new Date();
            maturityDate.setMonth(maturityDate.getMonth() + tenure);
            
            // Display results
            document.getElementById('resultPrincipal').textContent = '₹' + principal.toLocaleString('en-IN');
            document.getElementById('resultInterest').textContent = '₹' + interest.toLocaleString('en-IN', {maximumFractionDigits: 2});
            document.getElementById('resultMaturity').textContent = '₹' + maturity.toLocaleString('en-IN', {maximumFractionDigits: 2});
            document.getElementById('resultDate').textContent = maturityDate.toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            document.getElementById('resultsSection').classList.add('show');
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // Go back to home
        function goBack() {
            window.location.href = BASE_URL + '/cashcached';
        }
        
        // Initialize
        loadProducts();
    </script>
</body>
</html>
