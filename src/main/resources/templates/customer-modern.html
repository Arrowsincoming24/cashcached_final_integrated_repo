<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - CashCached</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/fd-simulator/css/premium-theme.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1f3a;
            min-height: 100vh;
        }

        /* Top Navigation */
        .top-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Container */
        .container-fluid {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        /* Hero Section */
        .hero-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-title {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            margin-bottom: 30px;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .hero-stat {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero-stat-value {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .hero-stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        /* Product Cards */
        .section-title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #06b6d4 0%, #0891b2 100%);
        }

        .product-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .product-name {
            color: white;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-code {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .product-rate {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .product-detail {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
        }

        .product-detail-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .product-detail-value {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-create-fd {
            flex: 1;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-create-fd:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-details {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-details:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* My FDs Section */
        .my-fds-grid {
            display: grid;
            gap: 20px;
        }

        .fd-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 25px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .fd-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .fd-icon {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        .fd-info h4 {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .fd-details-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .fd-detail-item {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .fd-detail-item strong {
            color: white;
            display: block;
            font-size: 16px;
            margin-top: 3px;
        }

        .fd-status {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
        }

        .fd-status.active {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .fd-status.matured {
            background: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        /* Calculator Section */
        .calculator-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .result-card {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-top: 25px;
            text-align: center;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .result-value {
            color: white;
            font-size: 42px;
            font-weight: 700;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: white;
            margin-bottom: 10px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card,
        .fd-card {
            animation: fadeInUp 0.6s ease-out;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }

        /* Responsive */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .fd-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .fd-details-grid {
                grid-template-columns: 1fr 1fr;
            }

            .nav-menu {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background Circles -->
    <div class="bg-circles">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <span style="font-size: 28px; color: #6366f1; font-weight: 700;">∞</span>
                <span style="background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">CASHCACHED</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="active">Dashboard</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#my-fds">My FDs</a></li>
                <li><a href="#calculator">Calculator</a></li>
            </ul>
            <div class="user-section">
                <button class="btn-details" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
                <div class="user-avatar" id="userAvatar">C</div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid">
        <!-- Hero Section -->
        <div class="hero-section" id="dashboard">
            <div class="hero-content">
                <h1 class="hero-title">Welcome back! 👋</h1>
                <p class="hero-subtitle">Manage your fixed deposits and grow your wealth</p>
                <div class="hero-stats">
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="totalFDs">0</div>
                        <div class="hero-stat-label">Total FDs</div>
                    </div>
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="activeFDs">0</div>
                        <div class="hero-stat-label">Active FDs</div>
                    </div>
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="totalInvestment">₹0</div>
                        <div class="hero-stat-label">Total Investment</div>
                    </div>
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="maturedFDs">0</div>
                        <div class="hero-stat-label">Matured FDs</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Available Products -->
        <section id="products">
            <h2 class="section-title">
                <i class="fas fa-box"></i> Available Products
            </h2>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <!-- My FDs -->
        <section id="my-fds">
            <h2 class="section-title">
                <i class="fas fa-file-invoice-dollar"></i> My Fixed Deposits
            </h2>
            <div class="my-fds-grid" id="myFDsGrid">
                <!-- FDs will be loaded here -->
            </div>
        </section>

        <!-- Calculator -->
        <section id="calculator" style="margin-top: 40px;">
            <h2 class="section-title">
                <i class="fas fa-calculator"></i> FD Calculator
            </h2>
            <div class="calculator-card">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Principal Amount (₹)</label>
                            <input type="number" class="form-control" id="calcAmount" placeholder="100000" value="100000">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Interest Rate (%)</label>
                            <input type="number" class="form-control" id="calcRate" placeholder="7.5" value="7.5" step="0.1">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Tenure (Months)</label>
                            <input type="number" class="form-control" id="calcTenure" placeholder="12" value="12">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Compounding Frequency</label>
                            <select class="form-select" id="calcFrequency">
                                <option value="MONTHLY">Monthly</option>
                                <option value="QUARTERLY" selected>Quarterly</option>
                                <option value="HALF_YEARLY">Half Yearly</option>
                                <option value="YEARLY">Yearly</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12">
                        <button class="btn-create-fd w-100" onclick="calculateFD()">
                            <i class="fas fa-calculator"></i> Calculate Returns
                        </button>
                    </div>
                </div>
                <div id="calcResult" style="display: none;">
                    <div class="result-card">
                        <div class="result-label">Maturity Amount</div>
                        <div class="result-value" id="maturityAmount">₹0</div>
                        <div style="margin-top: 15px; font-size: 16px;">
                            Interest Earned: <strong id="interestEarned">₹0</strong>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/fd-simulator/api/customer';
        const token = localStorage.getItem('token');

        // Load dashboard stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/dashboard/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const stats = await response.json();
                
                document.getElementById('totalFDs').textContent = stats.totalFixedDeposits || 0;
                document.getElementById('activeFDs').textContent = stats.activeFixedDeposits || 0;
                document.getElementById('maturedFDs').textContent = stats.maturedFixedDeposits || 0;
                document.getElementById('totalInvestment').textContent = `₹${(stats.totalActiveAmount || 0).toLocaleString()}`;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const products = await response.json();
                
                const grid = document.getElementById('productsGrid');
                if (products.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><h3>No products available</h3><p>Check back later for new investment opportunities</p></div>';
                    return;
                }
                
                grid.innerHTML = products.map(product => `
                    <div class="product-card">
                        <div class="product-header">
                            <div>
                                <div class="product-name">${product.productName || 'FD Product'}</div>
                                <div class="product-code">${product.productCode || 'N/A'}</div>
                            </div>
                            <div class="product-rate">${product.interestRate || 7.5}%</div>
                        </div>
                        <div class="product-description">
                            ${product.description || 'Fixed deposit with competitive interest rates'}
                        </div>
                        <div class="product-details">
                            <div class="product-detail">
                                <div class="product-detail-label">Min Amount</div>
                                <div class="product-detail-value">₹${(product.minAmount || 10000).toLocaleString()}</div>
                            </div>
                            <div class="product-detail">
                                <div class="product-detail-label">Max Amount</div>
                                <div class="product-detail-value">₹${(product.maxAmount || 1000000).toLocaleString()}</div>
                            </div>
                            <div class="product-detail">
                                <div class="product-detail-label">Min Tenure</div>
                                <div class="product-detail-value">${product.minTenureMonths || 6}m</div>
                            </div>
                            <div class="product-detail">
                                <div class="product-detail-label">Max Tenure</div>
                                <div class="product-detail-value">${product.maxTenureMonths || 60}m</div>
                            </div>
                        </div>
                        <div class="product-actions">
                            <button class="btn-create-fd" onclick="createFD(${product.id})">
                                <i class="fas fa-plus"></i> Create FD
                            </button>
                            <button class="btn-details" onclick="viewDetails(${product.id})">
                                <i class="fas fa-info-circle"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // Load my FDs
        async function loadMyFDs() {
            try {
                const response = await fetch(`${API_BASE}/fixed-deposits`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const fds = await response.json();
                
                const grid = document.getElementById('myFDsGrid');
                if (fds.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-file-invoice"></i><h3>No fixed deposits yet</h3><p>Create your first FD to start growing your wealth</p></div>';
                    return;
                }
                
                grid.innerHTML = fds.map(fd => `
                    <div class="fd-card">
                        <div class="fd-icon">
                            <i class="fas fa-file-invoice-dollar"></i>
                        </div>
                        <div class="fd-info">
                            <h4>FD #${fd.id}</h4>
                            <div class="fd-details-grid">
                                <div class="fd-detail-item">
                                    Amount
                                    <strong>₹${fd.principalAmount.toLocaleString()}</strong>
                                </div>
                                <div class="fd-detail-item">
                                    Rate
                                    <strong>${fd.interestRate}%</strong>
                                </div>
                                <div class="fd-detail-item">
                                    Tenure
                                    <strong>${fd.tenureMonths} months</strong>
                                </div>
                                <div class="fd-detail-item">
                                    Maturity
                                    <strong>₹${fd.maturityAmount.toLocaleString()}</strong>
                                </div>
                            </div>
                        </div>
                        <div class="fd-status ${fd.status.toLowerCase()}">
                            ${fd.status}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading FDs:', error);
            }
        }

        // Calculate FD
        async function calculateFD() {
            const amount = parseFloat(document.getElementById('calcAmount').value);
            const rate = parseFloat(document.getElementById('calcRate').value);
            const tenure = parseInt(document.getElementById('calcTenure').value);
            const frequency = document.getElementById('calcFrequency').value;

            try {
                const response = await fetch(`${API_BASE}/calculate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        principalAmount: amount,
                        interestRate: rate,
                        tenureInMonths: tenure,
                        compoundingFrequency: frequency
                    })
                });
                const result = await response.json();
                
                document.getElementById('maturityAmount').textContent = `₹${result.maturityAmount.toLocaleString()}`;
                document.getElementById('interestEarned').textContent = `₹${result.interestAmount.toLocaleString()}`;
                document.getElementById('calcResult').style.display = 'block';
            } catch (error) {
                alert('Error calculating FD: ' + error.message);
            }
        }

        function createFD(productId) {
            alert('Create FD feature - Coming soon!\nProduct ID: ' + productId);
        }

        function viewDetails(productId) {
            alert('View product details - Coming soon!\nProduct ID: ' + productId);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '/fd-simulator/login';
            }
        }

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                window.location.href = '/fd-simulator/login';
                return;
            }
            loadStats();
            loadProducts();
            loadMyFDs();
        });
    </script>
</body>
</html>
