<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="context-path" content="/fd-simulator">
    <title>FD Calculator - CASHCACHED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; background: rgba(255,255,255,0.1); border-radius: 50%; animation: float 15s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-100px) rotate(180deg); } }
        
        .container { position: relative; z-index: 1; max-width: 1200px; padding: 40px 20px; }
        
        .header { text-align: center; margin-bottom: 50px; animation: fadeInDown 0.8s; }
        .header h1 { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .header p { font-size: 1.2rem; color: rgba(255,255,255,0.7); }
        
        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 40px; animation: fadeIn 1s; }
        .btn-control { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); font-weight: 600; }
        .btn-control:hover, .btn-control.active { background: linear-gradient(135deg, #667eea, #764ba2); border-color: transparent; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }
        
        .calculator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; animation: fadeInUp 1s; }
        
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 25px; padding: 35px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.3); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 25px 70px rgba(102,126,234,0.3); }
        
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 25px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: #667eea; }
        
        .form-group { margin-bottom: 25px; }
        .form-label { font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-bottom: 10px; display: block; font-weight: 600; }
        
        .form-select, .form-control { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 1rem; width: 100%; transition: all 0.3s; }
        .form-select:focus, .form-control:focus { background: rgba(255,255,255,0.12); border-color: #667eea; box-shadow: 0 0 20px rgba(102,126,234,0.3); outline: none; }
        .form-select option { background: #1a1a2e; color: #fff; }
        
        .slider-container { margin-bottom: 30px; }
        .slider { width: 100%; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.1); outline: none; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; -moz-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; box-shadow: 0 0 15px rgba(102,126,234,0.6); }
        .slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; border: none; }
        
        .slider-value { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.9rem; color: rgba(255,255,255,0.6); }
        .slider-current { font-size: 1.5rem; font-weight: 700; color: #667eea; }
        
        .btn-calculate { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: 700; width: 100%; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn-calculate:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.6); }
        
        .results { background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); border: 2px solid rgba(102,126,234,0.3); }
        .result-item { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .result-label { font-size: 0.95rem; color: rgba(255,255,255,0.7); font-weight: 600; }
        .result-value { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-back { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 30px; border-radius: 25px; margin-bottom: 30px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
        .btn-back:hover { background: rgba(255,255,255,0.2); transform: translateX(-5px); }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        @media (max-width: 768px) { .calculator-grid { grid-template-columns: 1fr; } .header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back to Home</button>
        
        <div class="header">
            <h1><i class="fas fa-calculator"></i> FD Calculator</h1>
            <p>Calculate your Fixed Deposit returns with precision</p>
        </div>
        
        <div class="controls">
            <button class="btn-control active" id="lang-en" onclick="changeLang('en')">🇬🇧 English</button>
            <button class="btn-control" id="lang-ja" onclick="changeLang('ja')">🇯🇵 日本語</button>
            <button class="btn-control active" id="curr-USD" onclick="changeCurr('USD')">USD $</button>
            <button class="btn-control" id="curr-INR" onclick="changeCurr('INR')">INR ₹</button>
            <button class="btn-control" id="curr-KWD" onclick="changeCurr('KWD')">KWD د.ك</button>
        </div>
        
        <div style="text-align: center; margin-bottom: 30px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; backdrop-filter: blur(10px);">
            <div style="font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-bottom: 8px;">💱 Exchange Rates (Base: USD)</div>
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                <span style="color: #667eea; font-weight: 600;">1 USD = 83.00 INR</span>
                <span style="color: #667eea; font-weight: 600;">1 USD = 0.31 KWD</span>
                <span style="color: #667eea; font-weight: 600;">1 INR = 0.01 USD</span>
                <span style="color: #667eea; font-weight: 600;">1 KWD = 3.23 USD</span>
            </div>
        </div>
        
        <div class="calculator-grid">
            <div class="card">
                <h3 class="card-title"><i class="fas fa-sliders-h"></i> <span id="txt-input">Input Details</span></h3>
                
                <div class="form-group">
                    <label class="form-label" id="txt-product">Select FD Product</label>
                    <select id="productSelect" class="form-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
                
                <div class="slider-container">
                    <label class="form-label" id="txt-amount">Principal Amount</label>
                    <div class="slider-current"><span id="currSymbol">$</span><span id="amountValue">100000</span></div>
                    <input type="range" class="slider" id="amountSlider" min="5000" max="1000000" step="5000" value="100000" oninput="updateAmount()">
                    <div class="slider-value"><span>5K</span><span>1M</span></div>
                </div>
                
                <div class="slider-container">
                    <label class="form-label" id="txt-tenure">Tenure (Months)</label>
                    <div class="slider-current"><span id="tenureValue">12</span> <span id="txt-months">months</span></div>
                    <input type="range" class="slider" id="tenureSlider" min="3" max="60" value="12" oninput="updateTenure()">
                    <div class="slider-value"><span>3</span><span>60</span></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" id="txt-rate">Interest Rate (%)</label>
                    <input type="text" class="form-control" id="rateInput" value="7.5" readonly>
                </div>
                
                <button class="btn-calculate" onclick="calculate()"><i class="fas fa-calculator"></i> <span id="txt-calc">Calculate Returns</span></button>
            </div>
            
            <div class="card results">
                <h3 class="card-title"><i class="fas fa-chart-line"></i> <span id="txt-results">Your Returns</span></h3>
                
                <div class="result-item">
                    <span class="result-label" id="txt-principal">Principal Amount</span>
                    <span class="result-value" id="resPrincipal"><span id="currSymbol2">$</span>0</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label" id="txt-interest">Interest Earned</span>
                    <span class="result-value" id="resInterest"><span id="currSymbol3">$</span>0</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label" id="txt-maturity">Maturity Amount</span>
                    <span class="result-value" id="resMaturity"><span id="currSymbol4">$</span>0</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label" id="txt-date">Maturity Date</span>
                    <span class="result-value" style="font-size: 1.3rem;" id="resDate">-</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/fd-simulator/js/auth.js"></script>
    <script>
        const BASE_URL = window.__FD_CONTEXT__ || '/fd-simulator';
        let products = [];
        let currentLang = 'en';
        let currentCurr = 'USD';
        
        const translations = {
            en: { input: 'Input Details', product: 'Select FD Product', amount: 'Principal Amount', tenure: 'Tenure (Months)', months: 'months', rate: 'Interest Rate (%)', calc: 'Calculate Returns', results: 'Your Returns', principal: 'Principal Amount', interest: 'Interest Earned', maturity: 'Maturity Amount', date: 'Maturity Date' },
            ja: { input: '入力詳細', product: 'FD商品を選択', amount: '元本金額', tenure: '期間（月）', months: 'ヶ月', rate: '金利 (%)', calc: 'リターンを計算', results: 'あなたのリターン', principal: '元本', interest: '利息', maturity: '満期金額', date: '満期日' }
        };
        
        const currSymbols = { USD: '$', INR: '₹', KWD: 'د.ك' };
        
        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('[id^="lang-"]').forEach(b => b.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
            const t = translations[lang];
            Object.keys(t).forEach(k => { const el = document.getElementById('txt-' + k); if(el) el.textContent = t[k]; });
        }
        
        function changeCurr(curr) {
            currentCurr = curr;
            document.querySelectorAll('[id^="curr-"]').forEach(b => b.classList.remove('active'));
            document.getElementById('curr-' + curr).classList.add('active');
            const sym = currSymbols[curr];
            ['currSymbol', 'currSymbol2', 'currSymbol3', 'currSymbol4'].forEach(id => document.getElementById(id).textContent = sym);
            calculate();
        }
        
        function updateAmount() {
            const val = document.getElementById('amountSlider').value;
            document.getElementById('amountValue').textContent = parseInt(val).toLocaleString();
        }
        
        function updateTenure() {
            document.getElementById('tenureValue').textContent = document.getElementById('tenureSlider').value;
        }
        
        async function loadProducts() {
            try {
                const res = await fetch(BASE_URL + '/api/public/products/active');
                if (!res.ok) throw new Error('Failed');
                products = await res.json();
                const sel = document.getElementById('productSelect');
                sel.innerHTML = '<option value="">-- Select --</option>';
                products.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.name} (${p.interestRate}%)`;
                    opt.dataset.rate = p.interestRate;
                    sel.appendChild(opt);
                });
            } catch(e) { console.error(e); }
        }
        
        document.getElementById('productSelect').addEventListener('change', function() {
            const opt = this.options[this.selectedIndex];
            if(opt.value) document.getElementById('rateInput').value = opt.dataset.rate;
        });
        
        function calculate() {
            const principal = parseFloat(document.getElementById('amountSlider').value);
            const tenure = parseInt(document.getElementById('tenureSlider').value);
            const rate = parseFloat(document.getElementById('rateInput').value);
            if(!principal || !tenure || !rate) return;
            
            const interest = (principal * rate * tenure) / (12 * 100);
            const maturity = principal + interest;
            const date = new Date(); date.setMonth(date.getMonth() + tenure);
            
            document.getElementById('resPrincipal').innerHTML = currSymbols[currentCurr] + principal.toLocaleString();
            document.getElementById('resInterest').innerHTML = currSymbols[currentCurr] + interest.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('resMaturity').innerHTML = currSymbols[currentCurr] + maturity.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('resDate').textContent = date.toLocaleDateString();
        }
        
        function goBack() { window.location.href = BASE_URL + '/cashcached'; }
        
        // Particles
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = p.style.height = Math.random()*100+50+'px';
            p.style.left = Math.random()*100+'%';
            p.style.top = Math.random()*100+'%';
            p.style.animationDelay = Math.random()*15+'s';
            document.getElementById('particles').appendChild(p);
        }
        
        loadProducts();
    </script>
</body>
</html>
