<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="context-path" content="/fd-simulator">
    <title>Login - CashCached</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Geometric Shape 1 - Large Circle */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.4));
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 8s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.3);
        }
        
        /* Geometric Shape 2 - Medium Circle */
        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(147, 51, 234, 0.3));
            border-radius: 50%;
            bottom: -125px;
            left: -125px;
            animation: float 10s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.3);
        }
        
        /* Geometric Shape 3 - Triangle */
        .geometric-triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 260px solid rgba(139, 92, 246, 0.2);
            top: 20%;
            left: 10%;
            animation: rotate 20s linear infinite;
            filter: blur(2px);
        }
        
        /* Geometric Shape 4 - Square */
        .geometric-square {
            position: absolute;
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            bottom: 15%;
            right: 15%;
            animation: rotate 15s linear infinite reverse;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }
        
        /* Geometric Shape 5 - Small Circle */
        .geometric-circle-small {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.4), rgba(196, 181, 253, 0.2));
            border-radius: 50%;
            top: 60%;
            left: 5%;
            animation: float 12s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(147, 197, 253, 0.3);
        }
        
        /* Geometric Shape 6 - Hexagon */
        .geometric-hexagon {
            position: absolute;
            width: 100px;
            height: 173px;
            background: rgba(124, 58, 237, 0.15);
            top: 10%;
            right: 25%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: float 14s ease-in-out infinite;
            filter: blur(1px);
        }
        
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            top: -50%;
            left: -50%;
            animation: pulse 4s ease-in-out infinite;
        }
        
        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }
        
        .login-form {
            padding: 2.5rem;
            color: #2d3748;
        }
        
        .form-label {
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            background: #f7fafc;
            color: #2d3748;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
            color: #2d3748;
            transform: translateY(-2px);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .social-login {
            margin-top: 1.5rem;
        }
        
        .btn-google {
            background: linear-gradient(135deg, #db4437 0%, #c23321 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(219, 68, 55, 0.3);
        }
        
        .btn-google:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(219, 68, 55, 0.5);
        }
        
        .btn-phone {
            background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        
        .btn-phone:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }
        
        .otp-section {
            display: none;
            animation: fadeInUp 0.4s ease-out;
        }
        
        .text-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .text-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .form-select {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            color: #2d3748;
            border-radius: 10px;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            background: white;
            border-color: #667eea;
            color: #2d3748;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-link {
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-link:hover {
            color: #764ba2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Geometric Shapes -->
    <div class="geometric-triangle"></div>
    <div class="geometric-square"></div>
    <div class="geometric-circle-small"></div>
    <div class="geometric-hexagon"></div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container">
                    <div class="login-header">
                        <div class="logo"><i class="fas fa-infinity"></i> CashCached</div>
                        <p class="mb-0">Welcome Back!</p>
                    </div>
                    <div class="login-form">
                        <!-- Regular Login Form -->
                        <form id="loginForm" th:action="@{/api/auth/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login w-100">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </form>

                        <!-- OTP Login Form -->
                        <div id="otpSection" class="otp-section">
                            <form id="otpForm">
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phoneNumber" placeholder="+1234567890" required>
                                </div>
                                <button type="button" id="sendOtpBtn" class="btn btn-success btn-phone w-100 mb-3">
                                    <i class="fas fa-sms"></i> Send OTP
                                </button>
                                <div class="mb-3" id="otpInputDiv" style="display: none;">
                                    <label for="otp" class="form-label">Enter OTP</label>
                                    <input type="text" class="form-control" id="otp" placeholder="123456" maxlength="6" required>
                                </div>
                                <button type="button" id="verifyOtpBtn" class="btn btn-primary btn-login w-100" style="display: none;">
                                    <i class="fas fa-check"></i> Verify OTP
                                </button>
                            </form>
                        </div>

                        <div class="text-center mt-3">
                            <button type="button" id="toggleLogin" class="btn btn-link">
                                Login with Phone Number
                            </button>
                        </div>

                        <div class="social-login">
                            <a href="/fd-simulator/oauth2/authorization/google" class="btn btn-google">
                                <i class="fab fa-google"></i> Login with Google
                            </a>
                        </div>

                        <div class="text-center mt-3">
                            <p style="color: #6B7280;">Don't have an account? <a href="/fd-simulator/register" class="text-link">Register here</a></p>
                            <p style="color: #6B7280;"><a href="/fd-simulator/cashcached" class="text-link"><i class="fas fa-home"></i> Back to Home</a></p>
                        </div>

                        <!-- Language and Currency Selector -->
                        <div class="text-center mt-3">
                            <div class="btn-group" role="group">
                                <select class="form-select form-select-sm" id="languageSelect" onchange="changeLanguage()">
                                    <option value="en">English</option>
                                    <option value="ja">日本語</option>
                                </select>
                                <select class="form-select form-select-sm" id="currencySelect" onchange="changeCurrency()">
                                    <option value="USD">USD ($)</option>
                                    <option value="INR">INR (₹)</option>
                                    <option value="KWD">KWD (د.ك)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/fd-simulator/js/auth.js"></script>
    <script>
        let isOtpMode = false;
        
        document.getElementById('toggleLogin').addEventListener('click', function() {
            isOtpMode = !isOtpMode;
            const loginForm = document.getElementById('loginForm');
            const otpSection = document.getElementById('otpSection');
            const toggleBtn = document.getElementById('toggleLogin');
            
            if (isOtpMode) {
                loginForm.style.display = 'none';
                otpSection.style.display = 'block';
                toggleBtn.textContent = 'Login with Username';
            } else {
                loginForm.style.display = 'block';
                otpSection.style.display = 'none';
                toggleBtn.textContent = 'Login with Phone Number';
            }
        });

        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            if (!phoneNumber) {
                alert('Please enter phone number');
                return;
            }

            postJson('/api/auth/send-otp', { phoneNumber: phoneNumber }, { skipAuth: true })
            .then(response => response.json())
            .then(data => {
                if (data === 'OTP sent successfully') {
                    document.getElementById('otpInputDiv').style.display = 'block';
                    document.getElementById('verifyOtpBtn').style.display = 'block';
                    document.getElementById('sendOtpBtn').textContent = 'Resend OTP';
                    alert('OTP sent successfully!');
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending OTP');
            });
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const otp = document.getElementById('otp').value;
            
            if (!otp) {
                alert('Please enter OTP');
                return;
            }

            postJson('/api/auth/verify-otp', { phoneNumber: phoneNumber, otp: otp }, { skipAuth: true })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);
                    
                    const base = window.__FD_CONTEXT__ || '';
                    if (data.role === 'ADMIN') {
                        window.location.href = base + '/admin/dashboard';
                    } else {
                        window.location.href = base + '/customer/dashboard';
                    }
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error verifying OTP');
            });
        });

        // Language and Currency handling
        function changeLanguage() {
            const language = document.getElementById('languageSelect').value;
            localStorage.setItem('preferredLanguage', language);
            // In a real application, you would reload the page or update the UI
        }
        
        function changeCurrency() {
            const currency = document.getElementById('currencySelect').value;
            localStorage.setItem('preferredCurrency', currency);
            // In a real application, you would update the UI
        }
        
        // Load saved preferences
        function loadPreferences() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'en';
            const savedCurrency = localStorage.getItem('preferredCurrency') || 'USD';
            
            document.getElementById('languageSelect').value = savedLanguage;
            document.getElementById('currencySelect').value = savedCurrency;
        }
        
        // Handle regular login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            postJson('/api/auth/login', { username: username, password: password }, { skipAuth: true })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || `HTTP error! status: ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.token) {
                    // Store authentication data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);
                    
                    // Show success message
                    console.log('✅ Login successful! Role:', data.role);
                    
                    // Redirect based on role
                    const base = window.__FD_CONTEXT__ || '/fd-simulator';
                    if (data.role === 'ADMIN') {
                        window.location.href = base + '/admin/dashboard';
                    } else {
                        window.location.href = base + '/customer/dashboard';
                    }
                } else {
                    alert('❌ Login failed: No token received');
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                alert('❌ Login failed: ' + error.message);
            });
        });
        
        // Initialize preferences on page load
        loadPreferences();
    </script>
</body>
</html>
